# 증거파인더 전용 설정
#
# 포트를 8532 로 고정하는 이유
#   네이버 블로그 자동화의 대시보드도 Streamlit 이고, 둘 다 포트를 정하지
#   않으면 기본값 8501 을 쓴다. 실제로 그래서 사고가 났다 — 증거파인더가
#   먼저 8501 을 차지하자, 블로그 프로그램이 "대시보드가 이미 실행 중"으로
#   오판하고 브라우저만 열어 증거파인더 화면을 보여줬다.
#
#   블로그 대시보드가 8501 을 먼저 쓰던 자리이고 매일 쓰는 것이므로,
#   나중에 만든 증거파인더가 비켜 준다.
#
#   이 파일은 이 폴더에서 streamlit 을 실행할 때만 적용된다.
#   D: 의 블로그 시스템에는 아무 영향이 없다.
[server]
port = 8532

[browser]
gatherUsageStats = false
