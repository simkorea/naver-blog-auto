          </div>

        <div className="flex items-end gap-3 h-28">
          {[
            { m:"12월", done:5,  pend:1 },
            { m:"1월",  done:8,  pend:2 },
            { m:"2월",  done:6,  pend:3 },
            { m:"3월",  done:11, pend:2 },
            { m:"4월",  done:9,  pend:3 },
            { m:"5월",  done:4,  pend:1 },
          ].map(({ m, done, pend }) => {
            const max = 16;
            return (
              <div key={m} className="flex-1 flex flex-col items-center gap-1">
                <div className="w-full flex flex-col gap-0.5" style={{height: "96px", justifyContent: "flex-end"}}>
                  <div className="w-full bg-amber-400 rounded-t-sm transition-all" style={{height: `${(pend/max)*96}px`}}></div>
                  <div className="w-full bg-indigo-500 rounded-t-sm transition-all" style={{height: `${(done/max)*96}px`}}></div>
                </div>
                <div className="text-xs text-slate-400">{m}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Table */}
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 className="font-bold text-slate-800">발행 포스트 목록</h2>
            <p className="text-xs text-slate-400 mt-0.5">총 {POSTS.length}개 포스트</p>
          </div>
          <button onClick={() => showToast("목록을 새로고침했습니다.")}
            className="flex items-center gap-2 text-xs text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-semibold transition-colors">
            <Icons.RefreshCw /> 새로고침
          </button>
        </div>
        <table className="w-full">
          <thead>
            <tr className="bg-slate-50/70">
              {["제목", "카테고리", "작성일", "조회수", "상태"].map(h => (
                <th key={h} className="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {POSTS.map(post => (
              <tr key={post.id} className="hover:bg-slate-50/60 transition-colors group cursor-pointer">
                <td className="px-6 py-4">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 bg-indigo-50 rounded-lg flex items-center justify-center flex-shrink-0">
                      <span className="text-indigo-400"><Icons.FileText /></span>
                    </div>
                    <span className="text-sm font-medium text-slate-700 group-hover:text-indigo-600 transition-colors line-clamp-1 max-w-xs">{post.title}</span>
                  </div>
                </td>
                <td className="px-6 py-4">
                  <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">{post.cat}</span>
                </td>
                <td className="px-6 py-4 text-sm text-slate-500 whitespace-nowrap">{post.date}</td>
                <td className="px-6 py-4">
                  <div className="flex items-center gap-1.5 text-sm text-slate-600">
                    <span className="text-slate-400"><Icons.Eye /></span>
                    {post.views.toLocaleString()}
                  </div>
                </td>
                <td className="px-6 py-4">
                  {post.status === "done"
                    ? <span className="inline-flex items-center gap-1.5 text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full">
                        <Icons.CheckCircle /> 발행 완료
                      </span>
                    : <span className="inline-flex items-center gap-1.5 text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-full">
                        <Icons.Clock /> 발행 대기
                      </span>
                  }
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─────────────────────────────
   Write Wizard
───────────────────────────── */
function WriteWizard({ step, setStep, keyword, setKeyword, persona, setPersona, content, setContent, showToast }) {
  const steps = [
    { num: 1, label: "기본 입력",   desc: "키워드 & 페르소나" },
    { num: 2, label: "리치 에디터", desc: "원고 편집" },
    { num: 3, label: "최종 발행",   desc: "발행 대기열 등록" },
  ];

  const [activeFormat, setActiveFormat] = useState([]);
  const [generating, setGenerating] = useState(false);

  const toggleFmt = f => setActiveFormat(prev =>
    prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]
  );

  const handleGenerate = () => {
    setGenerating(true);
    setTimeout(() => { setGenerating(false); setStep(2); showToast("✨ AI 원고 생성 완료!"); }, 1600);
  };

  const handlePublish = () => {
    showToast("🚀 발행 대기열에 등록됐습니다! (Supabase post_queue)");
  };

  return (
    <div className="max-w-2xl mx-auto space-y-5 fade-in">

      {/* Progress Stepper */}
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <div className="flex items-center">
          {steps.map((s, idx) => {
            const isDone   = step > s.num;
            const isActive = step === s.num;
            return (
              <div key={s.num} className={`flex items-center ${idx < steps.length - 1 ? "flex-1" : ""}`}>
                <button onClick={() => setStep(s.num)}
                  className="flex items-center gap-2.5 group flex-shrink-0">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-200 ${
                    isDone   ? "bg-indigo-600 text-white shadow-md shadow-indigo-200" :
                    isActive ? "bg-indigo-600 text-white ring-4 ring-indigo-100 shadow-md shadow-indigo-200" :
                               "bg-slate-100 text-slate-400 group-hover:bg-slate-200"
                  }`}>
                    {isDone ? <Icons.CheckCircle /> : s.num}
                  </div>
                  <div className="text-left">
                    <div className={`text-xs font-bold ${isActive ? "text-indigo-600" : isDone ? "text-slate-700" : "text-slate-400"}`}>{s.label}</div>
                    <div className="text-xs text-slate-400">{s.desc}</div>
                  </div>
                </button>
                {idx < steps.length - 1 && (
                  <div className={`flex-1 h-0.5 mx-4 rounded-full transition-all duration-300 ${step > s.num ? "bg-indigo-500" : "bg-slate-200"}`}/>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Step 1 */}
      {step === 1 && (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5 fade-in">
          <div>
            <h2 className="text-slate-800 font-bold text-lg">기본 정보 입력</h2>
            <p className="text-slate-400 text-sm mt-0.5">AI가 원고를 생성하기 위한 핵심 정보를 입력해주세요.</p>
          </div>

          {/* Keyword */}
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-1.5">메인 키워드</label>
            <div className="flex gap-2">
              <input value={keyword} onChange={e => setKeyword(e.target.value)}
                placeholder="예: 신갈 펜타원 분양가, GTX-A 수혜 단지"
                className="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent placeholder:text-slate-300 transition-shadow"/>
              <button className="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-4 py-3 rounded-xl text-sm font-semibold transition-colors flex-shrink-0">
                <Icons.Sparkles /> AI 제안
              </button>
            </div>
            {/* Keyword chips */}
            <div className="flex gap-2 mt-2 flex-wrap">
              {["GTX-A 수혜", "아파트 청약", "분양가 상한제", "재건축 규제"].map(kw => (
                <button key={kw} onClick={() => setKeyword(kw)}
                  className="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-2.5 py-1 rounded-lg transition-colors">
                  {kw}
                </button>
              ))}
            </div>
          </div>

          {/* Persona */}
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-1.5">페르소나 (작성 어조)</label>
            <div className="grid grid-cols-2 gap-2">
              {PERSONAS.map(p => (
                <button key={p} onClick={() => setPersona(p)}
                  className={`text-sm text-left px-3.5 py-2.5 rounded-xl border transition-all font-medium ${
                    persona === p
                      ? "border-indigo-400 bg-indigo-50 text-indigo-700 shadow-sm"
                      : "border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50"
                  }`}>
                  {persona === p && <span className="mr-1.5">✓</span>}{p}
                </button>
              ))}
            </div>
          </div>

          {/* Extra */}
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-1.5">
              추가 지시사항 <span className="text-slate-400 font-normal">(선택)</span>
            </label>
            <textarea rows={3} placeholder="예: 30대 신혼부부 타겟으로 작성, 청약 경쟁률 데이터 반드시 포함"
              className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder:text-slate-300"/>
          </div>

          <div className="flex justify-end pt-1">
            <button onClick={handleGenerate} disabled={generating}
              className="flex items-center gap-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white px-7 py-3.5 rounded-xl text-sm font-bold transition-colors shadow-lg shadow-indigo-200">
              {generating
                ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> AI 생성 중...</>
                : <><Icons.Sparkles /> AI 원고 자동 생성</>
              }
            </button>
          </div>
        </div>
      )}

      {/* Step 2 */}
      {step === 2 && (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden fade-in">
          {/* Toolbar */}
          <div className="border-b border-slate-100 bg-slate-50/50 px-3 py-2 flex items-center gap-0.5 flex-wrap">
            {/* Format group */}
            {[
              { f: "bold",   I: Icons.Bold,        label: "굵게" },
              { f: "italic", I: Icons.Italic,       label: "기울임" },
            ].map(({ f, I, label }) => (
              <button key={f} title={label} onClick={() => toggleFmt(f)}
                className={`w-8 h-8 flex items-center justify-center rounded-lg transition-colors text-slate-600 ${activeFormat.includes(f) ? "bg-indigo-100 text-indigo-700" : "hover:bg-slate-200"}`}>
                <I />
              </button>
            ))}
            <div className="w-px h-5 bg-slate-200 mx-1"/>
            {[
              { I: Icons.AlignLeft,   label: "왼쪽 정렬" },
              { I: Icons.AlignCenter, label: "가운데 정렬" },
              { I: Icons.AlignRight,  label: "오른쪽 정렬" },
            ].map(({ I, label }) => (
              <button key={label} title={label}
                className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-200 transition-colors text-slate-600">
                <I />
              </button>
            ))}
            <div className="w-px h-5 bg-slate-200 mx-1"/>
            {[
              { I: Icons.Palette, label: "색상" },
              { I: Icons.Link,    label: "링크 삽입" },
              { I: Icons.List,    label: "목록" },
              { I: Icons.Table,   label: "표 삽입" },
              { I: Icons.Image,   label: "이미지 삽입" },
            ].map(({ I, label }) => (
              <button key={label} title={label}
                className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-200 transition-colors text-slate-600">
                <I />
              </button>
            ))}
            {/* Char count */}
            <div className="ml-auto flex items-center gap-2 pr-1">
              <span className="text-xs text-slate-400">{content.length.toLocaleString()}자</span>
              <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${content.length >= 3000 ? "bg-emerald-50 text-emerald-600" : "bg-amber-50 text-amber-600"}`}>
                {content.length >= 3000 ? "✓ 충분" : `목표 3,000자`}
              </span>
            </div>
          </div>

          {/* Progress bar */}
          <div className="h-0.5 bg-slate-100">
            <div className="h-full bg-indigo-500 transition-all duration-500"
              style={{width: `${Math.min(100, (content.length / 5000) * 100)}%`}}/>
          </div>

          {/* Editor */}
          <textarea value={content} onChange={e => setContent(e.target.value)}
            className="w-full px-6 py-5 text-sm text-slate-700 leading-loose focus:outline-none bg-white"
            rows={16}
            style={{fontFamily: "'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif", lineHeight: "1.9"}}/>

          {/* Utility bar */}
          <div className="border-t border-slate-100 bg-slate-50/50 px-4 py-2.5 flex items-center gap-2 flex-wrap">
            {[
              { I: Icons.CheckCircle, label: "맞춤법 교정" },
              { I: Icons.Zap,         label: "스마트 줄바꿈" },
              { I: Icons.Sparkles,    label: "AI 문장 보완" },
              { I: Icons.RefreshCw,   label: "전체 재생성" },
            ].map(({ I, label }) => (
              <button key={label} onClick={() => showToast(`${label} 완료`)}
                className="flex items-center gap-1.5 text-xs text-slate-600 bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                <I /> {label}
              </button>
            ))}
          </div>

          {/* Nav */}
          <div className="flex justify-between items-center px-6 py-4 border-t border-slate-100">
            <button onClick={() => setStep(1)}
              className="flex items-center gap-1.5 text-slate-500 hover:text-slate-700 text-sm font-medium transition-colors">
              ← 이전
            </button>
            <button onClick={() => setStep(3)}
              className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl text-sm font-bold transition-colors shadow-md shadow-indigo-200">
              다음 단계 <Icons.ArrowRight />
            </button>
          </div>
        </div>
      )}

      {/* Step 3 */}
      {step === 3 && (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5 fade-in">
          <div>
            <h2 className="text-slate-800 font-bold text-lg">최종 발행 확인</h2>
            <p className="text-slate-400 text-sm mt-0.5">아래 내용을 최종 확인 후 발행 대기열에 등록하세요.</p>
          </div>

          {/* Summary card */}
          <div className="bg-gradient-to-br from-slate-50 to-indigo-50/30 rounded-xl border border-slate-200 p-5 space-y-3">
            {[
              ["키워드",   keyword || "(미입력)", false],
              ["페르소나", persona, false],
              ["원고 분량", `${content.length.toLocaleString()}자`, content.length >= 3000],
              ["발행 채널", "네이버 블로그 (shimskorea)", false],
            ].map(([k, v, highlight]) => (
              <div key={k} className="flex items-center justify-between text-sm">
                <span className="text-slate-500">{k}</span>
                <span className={`font-semibold ${highlight ? "text-emerald-600" : "text-slate-700"}`}>{v}</span>
              </div>
            ))}
          </div>

          {/* Pipeline */}
          <div className="border border-slate-200 rounded-xl p-4 space-y-2.5">
            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">발행 파이프라인</div>
            {[
              "Supabase DB (post_queue 테이블) 에 저장",
              "로컬 PC Watcher 가 자동 감지",
              "네이버 블로그 Playwright 자동 업로드",
              "완료 시 status → done 업데이트",
            ].map((step, i) => (
              <div key={i} className="flex items-center gap-2.5 text-sm text-slate-600">
                <div className="w-5 h-5 bg-emerald-50 border border-emerald-200 rounded-full flex items-center justify-center flex-shrink-0">
                  <span className="text-emerald-500"><Icons.CheckCircle /></span>
                </div>
                <span>{step}</span>
              </div>
            ))}
          </div>

          {/* Tags */}
          <div>
            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">자동 추출 태그</label>
            <div className="flex gap-2 flex-wrap">
              {["#부동산", "#아파트분양", "#청약정보", "#GTX", "#수도권부동산"].map(tag => (
                <span key={tag} className="text-xs bg-indigo-50 text-indigo-600 border border-indigo-100 px-2.5 py-1 rounded-lg font-medium">{tag}</span>
              ))}
            </div>
          </div>

          <div className="flex items-center justify-between pt-2">
            <button onClick={() => setStep(2)}
              className="text-slate-500 hover:text-slate-700 text-sm font-medium transition-colors">
              ← 수정하기
            </button>
            <button onClick={handlePublish}
              className="flex items-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl text-sm font-bold transition-all shadow-xl shadow-indigo-200 hover:shadow-indigo-300 hover:scale-105 duration-150 group">
              <Icons.Send />
              최종 포스팅 — 발행 대기열 등록
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────
   Settings
───────────────────────────── */
function SettingsPage({ showToast }) {

    { label: "Gemini API Key",    type: "password", placeholder: "AIza..." },
    { label: "Leonardo API Key",  type: "password", placeholder: "xxxxxxxx-xxxx..." },

        <h2 className="font-bold text-slate-800 mb-1">API 키 설정</h2>
        <p className="text-slate-400 text-xs mb-5">변경 사항은 .env 파일 및 Streamlit Secrets에 반영됩니다.</p>
        <div className="space-y-4">
          {fields.map(f => (

              <label className="block text-sm font-semibold text-slate-700 mb-1.5">{f.label}</label>
              <input type={f.type} placeholder={f.placeholder} defaultValue={f.type === "password" ? "••••••••••••" : ""}
                className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"/>
            </div>
          ))}
        </div>
        <button onClick={() => showToast("설정이 저장됐습니다.")}
          className="mt-6 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow-md shadow-indigo-200">
          <Icons.CheckCircle /> 변경 사항 저장
        </button>
      </div>

      {/* API Status */}
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <h2 className="font-bold text-slate-800 mb-4">API 연결 상태</h2>
        <div className="space-y-3">
          {[
            { label: "Gemini API",    ok: true },
            { label: "Leonardo API",  ok: true },
            { label: "Naver Account", ok: true },
            { label: "Supabase DB",   ok: true },
            { label: "Playwright",    ok: true },
          ].map(({ label, ok }) => (
            <div key={label} className="flex items-center justify-between">
              <span className="text-sm text-slate-600">{label}</span>
              <span className={`inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full ${ok ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
                {ok ? <Icons.CheckCircle /> : "✕"}
                {ok ? "연결됨" : "오류"}
              </span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
